spring.application.name=AuthenticationSystem
spring.jpa.open-in-view=false

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/authentication_system}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate config
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart upload limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Properties
jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d

# Cookies Properties
app.cookie.http-only=true
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.path=/api/auth
app.cookie.same-site=Strict
app.cookie.max-age=7d

# App URLs and Uploads
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8080}
app.upload.dir=${UPLOAD_DIR:./uploads/avatars}

# Email service
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
